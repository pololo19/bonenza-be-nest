trigger:
  branches:
    include:
    - main
    - dev

resources:
  repositories:
  - repository: bonenza-be-nest-main
    name: sparck-lucky/bonenza-be-nest
    type: github
    endpoint: sparck-lucky
    ref: main
  - repository: bonenza-be-nest-dev
    name: sparck-lucky/bonenza-be-nest
    type: github
    endpoint: sparck-lucky
    ref: dev
  - repository: argocd-bonenza-be-nest
    name: bonenza/argocd-bonenza-be-nest
    type: git

pool:
  name: nodepool1
  # name: Azure Pipelines

stages:
- stage: buildandeploy
  jobs:
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}: 
    - template: template.yml
      parameters:
        GroupVariablesName: BONENZA-BE-NEST-PRD

  - ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}: 
    - template: template.yml
      parameters:
        GroupVariablesName: BONENZA-BE-NEST-STG
